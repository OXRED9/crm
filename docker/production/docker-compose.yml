# Production stack for Frappe CRM.
#
# Unlike ../docker-compose.yml (which is a development bench that runs `bench
# init` at container start), this stack ships an image with the app already
# built, so the web service binds its port within seconds instead of after a
# ~20 minute build. That is what makes it survivable under a health check.
#
# Copy .env.example to .env and edit it before deploying.

# Built locally from ./Dockerfile rather than pulled. The published
# ghcr.io/frappe/crm images do not contain the crm app -- see Dockerfile for the
# full explanation. Every service shares one image; Compose builds it once.
x-crm-image: &crm_image
  image: crm-local:latest
  build:
    context: .
    dockerfile: Dockerfile

x-backend-env: &backend_env
  DB_HOST: db
  DB_PORT: "3306"
  # These fall back to "admin" so the file still parses when no .env is present
  # (a deploy platform clones the repo, and .env is gitignored). Override them
  # via the platform's environment variable settings before exposing this
  # publicly -- see README.md.
  MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
  MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}

x-bench-volumes: &bench_volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs

services:
  # The primary service. This is the one to point the platform health check at.
  frontend:
    <<: *crm_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # Pinning this to the site name makes Frappe resolve every request to that
      # site regardless of the Host header. Without it, a health probe hitting a
      # raw IP or an internal hostname gets "Site does not exist" and fails.
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-crm.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes: *bench_volumes
    # Declared for platforms that discover the container port from `expose`
    # rather than from a published `ports` mapping.
    expose:
      - "8080"
    ports:
      # Written as a literal on purpose -- do NOT turn this back into
      # "${CRM_HTTP_PORT:-8052}:8080". Deploy platforms that read the compose
      # file with their own YAML parser do not expand ${VAR:-default}, so a
      # templated value here reads as "no host port published" and the deploy is
      # rejected before Docker ever sees it.
      #
      # Host 8052 -> nginx 8080 inside the container. To change the public port,
      # edit the left-hand number here.
      - "8052:8080"
    healthcheck:
      # Probes /crm, not /api/method/ping. `ping` answers 200 as long as any
      # site resolves, so it reports healthy even when the CRM app failed to
      # install -- a site with no CRM on it returns 200 on ping and 404 on /crm.
      #
      # 403 counts as healthy: /crm requires a login, so an anonymous probe gets
      # 403 when CRM *is* installed and 404 when it is not. Accepting 200 and
      # 403 while rejecting 404 is what makes this check actually distinguish a
      # working deploy from a broken one. http.client is used over urllib
      # because it returns the status instead of raising on 4xx.
      test:
        - CMD-SHELL
        - python3 -c "import http.client,sys; c=http.client.HTTPConnection('localhost',8080,timeout=5); c.request('GET','/crm'); s=c.getresponse().status; sys.exit(0 if s in (200,403) else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      # First boot has to wait for create-site to finish. Give it room, and set
      # the platform's own grace period to at least this much.
      start_period: 300s
    depends_on:
      - backend
      - websocket
    restart: unless-stopped

  backend:
    <<: *crm_image
    environment: *backend_env
    volumes: *bench_volumes
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped

  websocket:
    <<: *crm_image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: *bench_volumes
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped

  queue-short:
    <<: *crm_image
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: *bench_volumes
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped

  queue-long:
    <<: *crm_image
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes: *bench_volumes
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *crm_image
    command: ["bench", "schedule"]
    volumes: *bench_volumes
    depends_on:
      create-site:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: writes common_site_config.json into the sites volume.
  configurator:
    <<: *crm_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes: *bench_volumes
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # One-shot: creates the site on first deploy, no-ops on every deploy after.
  create-site:
    <<: *crm_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --db-root-username=root \
            --db-root-password=$$MARIADB_ROOT_PASSWORD \
            --admin-password=$$ADMIN_PASSWORD \
            --install-app crm \
            --set-default $$SITE_NAME;
        fi;
    environment:
      <<: *backend_env
      SITE_NAME: ${SITE_NAME:-crm.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes: *bench_volumes
    depends_on:
      configurator:
        condition: service_completed_successfully
    restart: "no"

  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
